[package]
name = "dataguard-workbench"
# The installers' version comes from app/package.json (tauri.conf.json);
# this one is only Cargo's.
version = "0.0.0"
description = "Data Guard Workbench desktop shell"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "dataguard_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
# 2.8.0 is where WebviewWindowBuilder::on_new_window (what the pop-out windows
# need) first appeared; 2.12.0 is the release this was written against.
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.6.0"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
