<?xml version="1.0" encoding="UTF-8"?>
<!--
  fsfo-timeline-crash.svg — Oracle 19c Data Guard broker, fast-start failover after a primary host crash.

  TIME -> X SCALE (single linear scale, every x in this file is derived from it):

      x(t) = 280 + 10 * t          [px per second = 10]

  Domain t = -14 s .. +80 s  ->  x = 140 .. 1080 (plot area).
  Anchor points used below:
      x(-14) = 140   plot left edge / start of the pre-failure zone
      x(  0) = 280   t = 0, the failure event
      x( 30) = 580   FastStartFailoverThreshold expiry (default 30 s)
      x( 45) = 730   new primary open (illustrative)
      x( 80) = 1080  plot right edge
  Grid lines every 10 s: x = 180, 280, 380, 480, 580, 680, 780, 880, 980, 1080.
  Lane bands (y): Primary 152..186, Observer 234..268, Standby 322..356. Axis y = 386.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Fast-start failover after a primary host crash</title>
  <desc id="desc">Timeline with three lanes (Primary, Observer, Standby) on a seconds axis. The primary crashes at t = 0. The observer detects the lost connection in under a second, then spends FastStartFailoverThreshold (default 30 seconds) trying to reconnect while confirming with the target standby that it also lost contact and is ready. At t = 30 the observer initiates failover; the standby applies its remaining redo, converts to the primary role and opens read-write at about t = 45 seconds.</desc>

  <defs>
    <style>
      text { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
      .s { font-family: Helvetica Neue, Arial, sans-serif; }
      .m { font-family: SF Mono, Menlo, Consolas, monospace; }
    </style>
    <pattern id="hatchRed" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#FCEAEA"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#E28C8C" stroke-width="3"/>
    </pattern>
    <marker id="arrEndSlate" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrStartSlate" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#475569"/>
    </marker>
    <marker id="arrEndViolet" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D5AE6"/>
    </marker>
  </defs>

  <!-- white background (explicit, for dark-mode renderers) -->
  <rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>

  <!-- ============================ title ============================ -->
  <text class="s" x="40" y="34" font-size="19" font-weight="600" fill="#0F172A">Fast-start failover after a primary host crash</text>
  <text class="s" x="40" y="56" font-size="13" fill="#475569">Oracle 19c Data Guard broker — MaxAvailability (SYNC), broker properties at their defaults.</text>

  <!-- ============================ legend ============================ -->
  <g>
    <rect x="40" y="69" width="16" height="14" rx="2" fill="#D6EEE9" stroke="#0E7C6B" stroke-width="1.5"/>
    <text class="s" x="62" y="80" font-size="12" fill="#334155">open read-write (serving)</text>

    <rect x="238" y="69" width="16" height="14" rx="2" fill="#DCE7FD" stroke="#2563EB" stroke-width="1.5"/>
    <text class="s" x="260" y="80" font-size="12" fill="#334155">applying redo (standby duty)</text>

    <rect x="454" y="69" width="16" height="14" rx="2" fill="#FDF0DC" stroke="#D97706" stroke-width="1.5"/>
    <text class="s" x="476" y="80" font-size="12" fill="#334155">waiting / countdown window</text>

    <rect x="658" y="69" width="16" height="14" rx="2" fill="url(#hatchRed)" stroke="#D64545" stroke-width="1.5"/>
    <text class="s" x="680" y="80" font-size="12" fill="#334155">down / stalled</text>

    <circle cx="798" cy="76" r="7" fill="#FFFFFF" stroke="#6D5AE6" stroke-width="2.5"/>
    <circle cx="798" cy="76" r="3" fill="#6D5AE6"/>
    <text class="s" x="812" y="80" font-size="12" fill="#334155">observer decision or command</text>
  </g>

  <!-- ================== top brace: total outage 0 -> 45 s ================== -->
  <text class="s" x="505" y="104" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">total outage ≈ detection + threshold + failover execution</text>
  <path d="M 280,128 Q 280,120 288,120 L 497,120 Q 505,120 505,112 Q 505,120 513,120 L 722,120 Q 730,120 730,128"
        fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- ============================ grid ============================ -->
  <g stroke="#E7EDF3" stroke-width="1">
    <line x1="180" y1="150" x2="180" y2="386"/>
    <line x1="280" y1="150" x2="280" y2="386"/>
    <line x1="380" y1="150" x2="380" y2="386"/>
    <line x1="480" y1="150" x2="480" y2="386"/>
    <line x1="580" y1="150" x2="580" y2="386"/>
    <line x1="680" y1="150" x2="680" y2="386"/>
    <line x1="780" y1="150" x2="780" y2="386"/>
    <line x1="880" y1="150" x2="880" y2="386"/>
    <line x1="980" y1="150" x2="980" y2="386"/>
    <line x1="1080" y1="150" x2="1080" y2="386"/>
  </g>
  <!-- event guides: t = 0, t = 30, t = 45 -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="280" y1="150" x2="280" y2="386"/>
    <line x1="580" y1="150" x2="580" y2="386"/>
    <line x1="730" y1="150" x2="730" y2="386"/>
  </g>

  <!-- ============================ primary lane ============================ -->
  <text class="s" x="128" y="173" font-size="14" font-weight="600" fill="#334155" text-anchor="end">Primary</text>
  <rect x="140" y="152" width="140" height="34" rx="3" fill="#D6EEE9" stroke="#0E7C6B" stroke-width="1.5"/>
  <text class="s" x="210" y="173" font-size="12" fill="#0A5C50" text-anchor="middle">open, ships redo</text>
  <rect x="280" y="152" width="800" height="34" rx="3" fill="url(#hatchRed)" stroke="#D64545" stroke-width="1.5"/>
  <rect x="386" y="161" width="228" height="17" fill="#FFFFFF" opacity="0.9"/>
  <text class="s" x="392" y="174" font-size="12" font-weight="600" fill="#A83232">down — no redo generated, no service</text>

  <!-- crash marker at t = 0 -->
  <text class="s" x="290" y="146" font-size="13" font-weight="600" fill="#A83232">primary host crashes</text>
  <circle cx="280" cy="169" r="11" fill="#FFFFFF" stroke="#D64545" stroke-width="2.5"/>
  <line x1="274" y1="163" x2="286" y2="175" stroke="#D64545" stroke-width="2.5"/>
  <line x1="286" y1="163" x2="274" y2="175" stroke="#D64545" stroke-width="2.5"/>

  <!-- ============ observer detection callout (t ≈ 0, sub-second) ============ -->
  <rect x="286" y="192" width="176" height="17" fill="#FFFFFF" opacity="0.92"/>
  <text class="s" x="290" y="205" font-size="13" font-weight="600" fill="#334155">ping fails — connection lost</text>
  <rect x="286" y="211" width="552" height="16" fill="#FFFFFF" opacity="0.92"/>
  <text class="s" x="290" y="223" font-size="12" fill="#475569"><tspan class="m">ObserverPingInterval</tspan> × <tspan class="m">ObserverPingRetry</tspan> = 100 ms × 10 — detection in under a second</text>

  <!-- ============================ observer lane ============================ -->
  <text class="s" x="128" y="255" font-size="14" font-weight="600" fill="#334155" text-anchor="end">Observer</text>
  <rect x="580" y="250" width="500" height="2" fill="#E2E8F0"/>
  <rect x="140" y="234" width="140" height="34" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text class="s" x="210" y="255" font-size="12" fill="#475569" text-anchor="middle">pinging primary</text>
  <rect x="280" y="234" width="300" height="34" rx="3" fill="#FDF0DC" stroke="#D97706" stroke-width="1.5"/>
  <text class="s" x="430" y="255" font-size="12" fill="#9A5B04" text-anchor="middle">reconnect attempts</text>
  <!-- tick: the observer first loses the connection -->
  <line x1="280" y1="230" x2="280" y2="272" stroke="#D64545" stroke-width="2"/>
  <!-- decision marker at t = 30 -->
  <circle cx="580" cy="251" r="9" fill="#FFFFFF" stroke="#6D5AE6" stroke-width="2.5"/>
  <circle cx="580" cy="251" r="3.5" fill="#6D5AE6"/>

  <!-- =============== observer <-> standby readiness exchange =============== -->
  <line x1="330" y1="278" x2="330" y2="318" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"
        marker-start="url(#arrStartSlate)" marker-end="url(#arrEndSlate)"/>
  <rect x="336" y="281" width="182" height="32" fill="#FFFFFF" opacity="0.92"/>
  <text class="s" x="340" y="292" font-size="12" fill="#475569">confirms the standby also lost</text>
  <text class="s" x="340" y="308" font-size="12" fill="#475569">contact and is ready</text>

  <!-- =============== observer initiates failover at t = 30 =============== -->
  <line x1="580" y1="272" x2="580" y2="318" stroke="#6D5AE6" stroke-width="2" marker-end="url(#arrEndViolet)"/>
  <rect x="586" y="283" width="120" height="18" fill="#FFFFFF" opacity="0.92"/>
  <text class="s" x="590" y="296" font-size="13" font-weight="600" fill="#6D5AE6">initiates failover</text>

  <!-- ============================ standby lane ============================ -->
  <text class="s" x="128" y="343" font-size="14" font-weight="600" fill="#334155" text-anchor="end">Standby</text>
  <rect x="140" y="322" width="140" height="34" rx="3" fill="#DCE7FD" stroke="#2563EB" stroke-width="1.5"/>
  <text class="s" x="210" y="343" font-size="12" fill="#1D4ED8" text-anchor="middle">applying redo</text>
  <rect x="280" y="322" width="300" height="34" rx="3" fill="#DCE7FD" stroke="#2563EB" stroke-width="1.5"/>
  <text class="s" x="430" y="343" font-size="12" fill="#1D4ED8" text-anchor="middle">keeps applying received redo</text>
  <rect x="580" y="322" width="150" height="34" rx="3" fill="#FDF0DC" stroke="#D97706" stroke-width="1.5"/>
  <text class="s" x="655" y="343" font-size="12" fill="#9A5B04" text-anchor="middle">applies remaining redo</text>
  <rect x="730" y="322" width="350" height="34" rx="3" fill="#D6EEE9" stroke="#0E7C6B" stroke-width="1.5"/>
  <text class="s" x="905" y="343" font-size="12" fill="#0A5C50" text-anchor="middle">open read-write — service restored</text>

  <!-- ============================ axis ============================ -->
  <line x1="140" y1="386" x2="1080" y2="386" stroke="#475569" stroke-width="1.5"/>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="180" y1="386" x2="180" y2="392"/>
    <line x1="280" y1="386" x2="280" y2="394"/>
    <line x1="380" y1="386" x2="380" y2="392"/>
    <line x1="480" y1="386" x2="480" y2="392"/>
    <line x1="580" y1="386" x2="580" y2="394"/>
    <line x1="680" y1="386" x2="680" y2="392"/>
    <line x1="730" y1="386" x2="730" y2="394"/>
    <line x1="780" y1="386" x2="780" y2="392"/>
    <line x1="880" y1="386" x2="880" y2="392"/>
    <line x1="980" y1="386" x2="980" y2="392"/>
    <line x1="1080" y1="386" x2="1080" y2="392"/>
  </g>
  <g class="s" font-size="12" fill="#64748B" text-anchor="middle">
    <text x="180" y="406">−10</text>
    <text x="280" y="406" fill="#0F172A" font-weight="600">0</text>
    <text x="380" y="406">10</text>
    <text x="480" y="406">20</text>
    <text x="580" y="406" fill="#0F172A" font-weight="600">30</text>
    <text x="680" y="406">40</text>
    <text x="730" y="406" fill="#0F172A" font-weight="600">45</text>
    <text x="780" y="406">50</text>
    <text x="880" y="406">60</text>
    <text x="980" y="406">70</text>
    <text x="1080" y="406">80</text>
  </g>
  <text class="s" x="620" y="426" font-size="13" fill="#475569" text-anchor="middle">seconds from failure (t = 0)</text>

  <!-- ================= under-axis braces: what each interval is governed by ================= -->
  <path d="M 280,440 Q 280,448 288,448 L 422,448 Q 430,448 430,456 Q 430,448 438,448 L 572,448 Q 580,448 580,440"
        fill="none" stroke="#D97706" stroke-width="1.5"/>
  <text class="m" x="430" y="476" font-size="13" fill="#0F172A" text-anchor="middle">FastStartFailoverThreshold</text>
  <text class="s" x="430" y="493" font-size="12" fill="#475569" text-anchor="middle">default 30 s, minimum 6 s</text>

  <path d="M 580,440 Q 580,448 588,448 L 647,448 Q 655,448 655,456 Q 655,448 663,448 L 722,448 Q 730,448 730,440"
        fill="none" stroke="#475569" stroke-width="1.5"/>
  <text class="s" x="586" y="476" font-size="13" font-weight="600" fill="#0F172A">failover execution — apply remaining redo, convert to primary, open read-write</text>
  <text class="s" x="586" y="493" font-size="12" fill="#475569">depends on redo left to apply and the role change — not a broker parameter</text>

  <!-- ============================ footnotes ============================ -->
  <g class="s" font-size="12" fill="#64748B">
    <text x="40" y="516">Data loss: none in MaxAvailability (SYNC). In MaxPerformance (ASYNC) it is bounded by <tspan class="m">FastStartFailoverLagLimit</tspan>.</text>
    <text x="40" y="532">The threshold window is skipped for user-configurable health conditions and for application-initiated <tspan class="m">DBMS_DG.INITIATE_FS_FAILOVER</tspan>.</text>
    <text x="40" y="548"><tspan class="m">FastStartFailoverAutoReinstate</tspan> = TRUE (default): the old primary is reinstated as a standby when it returns — out of scope here.</text>
  </g>
</svg>
